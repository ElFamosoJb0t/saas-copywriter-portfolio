<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | SaaSCopyApp</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1a1a;
            --ink-light: #4a4a4a;
            --ink-muted: #7a7a7a;
            --surface: #faf9f7;
            --surface-warm: #f3f0eb;
            --accent: #1a365d;
            --accent-light: #2d6bc7;
            --accent-soft: #eef3fb;
            --border: #e5e0d8;
            --serif: 'Instrument Serif', Georgia, serif;
            --sans: 'DM Sans', -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 18px; }
        body {
            font-family: var(--sans);
            color: var(--ink);
            background: var(--surface);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .nav {
            background: rgba(250, 249, 247, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0.8rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-logo {
            font-family: var(--sans);
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--ink);
            letter-spacing: -0.02em;
            text-decoration: none;
        }
        .nav-logo span { color: var(--accent-light); }

        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
        }

        .error-code {
            font-family: var(--serif);
            font-size: clamp(4rem, 12vw, 8rem);
            font-weight: 400;
            color: var(--border);
            line-height: 1;
            margin-bottom: 1rem;
            letter-spacing: -0.03em;
        }

        .error-title {
            font-family: var(--serif);
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 400;
            color: var(--ink);
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }
        .error-title em {
            font-style: italic;
            color: var(--accent-light);
        }

        .error-desc {
            font-size: 1rem;
            color: var(--ink-light);
            max-width: 440px;
            margin: 0 auto 2rem;
            line-height: 1.7;
        }

        .back-link {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 0.75rem 1.8rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s;
        }
        .back-link:hover {
            background: var(--accent-light);
            transform: translateY(-1px);
        }

        footer {
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--border);
            font-size: 0.78rem;
            color: var(--ink-muted);
            text-align: center;
        }

        @media (max-width: 640px) {
            html { font-size: 16px; }
            .content { padding: 3rem 1.2rem; }
        }
    </style>
</head>
<body>

<nav class="nav">
    <a href="/" class="nav-logo">SaaS<span>CopyApp</span></a>
</nav>

<main class="content">
    <div>
        <div class="error-code">404</div>
        <h1 class="error-title">This page doesn't <em>exist.</em></h1>
        <p class="error-desc">The page you're looking for may have been moved or removed. Head back to the portfolio to see my work.</p>
        <a href="/index.html" class="back-link">Back to Portfolio</a>
    </div>
</main>

<footer>
    &copy; 2026 SaaSCopyApp
</footer>

</body>
</html>
